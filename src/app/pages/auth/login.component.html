@let formInvalid = form.invalid || form.pristine;


<div class="grid grid-cols-12 min-h-screen items-center overflow-hidden">
  <div class="col-span-5 hidden lg:block">
    <img src="assets/banner.webp" 
        alt="" 
        class=" inset-0 size-full object-cover" 
    />
  </div>
  <div class="col-span-7 px-4 py-12 sm:px-6 lg:px-20 xl:px-24">
    <div class="mx-auto w-full max-w-sm lg:w-96">
      <div>
        <img src="assets/km-logo.jpg" alt="km-logo" class="w-auto" />
      </div>

      <div class="mt-10">
        <div>
          <form [formGroup]="form" (ngSubmit)="login()" novalidate>
            <form-with-errors [fields]="fields" (modelChange)="onChange($event)" (formReady)="form= $event" />

            <div class="flex items-center justify-end mt-6">
              <div class="text-sm/6">
                <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300">Forgot password?</a>
              </div>
            </div>
            
            <div>
              <button 
                [disabled]="formInvalid" 
                type="submit"
                [ngClass]="formInvalid ? 'disabled:cursor-not-allowed' : ''"
                class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 
                text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 
                focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 
                dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400 dark:focus-visible:outline-indigo-500" 
              >
                Sign in
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
